name: aqua-drift-simulator

x-worker: &worker
  build:
    context: ./backend
  restart: on-failure
  environment:
    API_URL: http://api:8000
    CURRENT_FIELD_URL: http://current-field:8001
  depends_on:
    api:
      condition: service_healthy
  networks: [aqua-drift]

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aqua_drift}
      POSTGRES_USER: ${POSTGRES_USER:-aqua_drift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aqua_drift}
    volumes:
      - aqua-drift-db:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      # TCP check: during first-run initialization PostgreSQL runs a temporary server on the
      # Unix socket only, so a socket-based pg_isready reports ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks: [aqua-drift]

  api:
    build:
      context: ./backend
    restart: unless-stopped
    # per-message deflate compresses the GIS stream (~3-4x on top of the delta encoding)
    command: ["uvicorn", "aqua_drift.api:app", "--host", "0.0.0.0", "--port", "8000",
              "--ws", "websockets", "--ws-per-message-deflate", "true"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aqua_drift}:${POSTGRES_PASSWORD:-aqua_drift}@db:5432/${POSTGRES_DB:-aqua_drift}
      MAX_SLANT_RANGE_YD: ${MAX_SLANT_RANGE_YD:-6000}
      ESTIMATION_AUTOSTART: ${ESTIMATION_AUTOSTART:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${API_PORT:-8091}:8000"
    networks: [aqua-drift]

  current-field:
    <<: *worker
    command: ["uvicorn", "aqua_drift.services.current_field:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  clock:
    <<: *worker
    command: ["python", "-m", "aqua_drift.services.clock"]

  target:
    <<: *worker
    command: ["python", "-m", "aqua_drift.services.target"]

  observer:
    <<: *worker
    command: ["python", "-m", "aqua_drift.services.observer"]
    deploy:
      replicas: ${OBSERVER_REPLICAS:-12}  # 4 initial + standby for forward deployment

  # acoustic source / Doppler computation (音源演算部): separate container
  doppler:
    <<: *worker
    command: ["python", "-m", "aqua_drift.services.doppler"]

  # forward (前程) deployment: places standby observers ahead of the ESTIMATED target
  deployer:
    <<: *worker
    command: ["python", "-m", "aqua_drift.services.deployer"]

  # receives observations only (no truth) through /internal/estimator-feed
  estimator:
    <<: *worker
    command: ["python", "-m", "aqua_drift.services.estimator"]
    # keep CPU for the browser when the GIS runs on the same machine
    cpus: ${ESTIMATOR_CPUS:-2}
    environment:
      API_URL: http://api:8000
      CURRENT_FIELD_URL: http://current-field:8001
      OMP_NUM_THREADS: ${ESTIMATOR_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${ESTIMATOR_THREADS:-2}

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8090}:80"
    networks: [aqua-drift]

volumes:
  aqua-drift-db:

networks:
  aqua-drift:
