name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e './backend[dev]'
      - run: ruff check backend
      - run: pytest backend/tests

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e './backend[dev]'
      - name: Encode a stream with the Python server encoder
        run: cd backend && python -m aqua_drift.analysis.wire_fixture ../wire-fixture.json 600
      - name: Decode it with the browser decoder and compare
        run: node web/tests/decoder_test.js wire-fixture.json
      - run: node --check web/app.js && node --check web/stream-worker.js && node --check web/stream-decoder.js

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [backend, compose, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start the full stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait for observers and the first estimate
        run: python e2e/wait_for_stack.py http://localhost:8091
      - name: Install headless Chromium
        run: |
          pip install "playwright>=1.47,<2"
          python -m playwright install --with-deps chromium
      - name: Browser check of the GIS
        run: python e2e/ui_check.py --url http://localhost:8090 --out e2e-artifacts
      - name: Collect container logs
        if: always()
        run: |
          mkdir -p e2e-artifacts
          docker compose ps > e2e-artifacts/compose-ps.txt
          docker compose logs --no-color > e2e-artifacts/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gis-e2e
          path: e2e-artifacts
