server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://api:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Always revalidate the page and its scripts so a rebuilt image shows up on a normal reload
    # (no Cache-Control lets the browser reuse an old app.js for hours). Unchanged files still
    # come back as 304 via ETag. The Cesium build under /cesium/ keeps the default caching.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /cesium/ {
        try_files $uri =404;
    }
}
