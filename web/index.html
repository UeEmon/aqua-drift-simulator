<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AQUA-DRIFT Simulator</title>
    <link rel="stylesheet" href="/cesium/Widgets/widgets.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="app">
      <section id="viewer-panel" aria-label="3D GIS">
        <div id="cesiumContainer"></div>
        <div id="status-strip">
          <span id="connection-status">接続中</span>
          <span>時刻: <strong id="tick">0</strong>秒</span>
          <span>観測者: <strong id="observer-count">0</strong></span>
          <span>推定状態: <strong id="observability">NO_OBSERVATION</strong></span>
        </div>
      </section>

      <aside id="control-panel">
        <header>
          <h1>AQUA-DRIFT</h1>
          <p>3D Marine Doppler Simulation System</p>
        </header>

        <section>
          <h2>対象状態</h2>
          <dl class="metrics">
            <div><dt>HDG</dt><dd id="hdg">--</dd></div>
            <div><dt>COG</dt><dd id="cog">--</dd></div>
            <div><dt>対水速力</dt><dd id="water-speed">--</dd></div>
            <div><dt>対地速力</dt><dd id="ground-speed">--</dd></div>
            <div><dt>深度</dt><dd id="depth">--</dd></div>
            <div><dt>相対速力</dt><dd id="relative-speed">--</dd></div>
          </dl>
        </section>

        <section>
          <h2>シナリオ設定</h2>
          <form id="config-form">
            <label>
              最大斜距離 (YD)
              <input id="max-range" type="number" min="1" step="100" required />
            </label>
            <label>
              目標HDG (度)
              <input id="desired-hdg" type="number" min="0" max="359.99" step="0.1" required />
            </label>
            <label>
              対水速力 (kt)
              <input id="desired-speed" type="number" min="0" step="0.1" required />
            </label>
            <label>
              目標深度 (Ft)
              <input id="desired-depth" type="number" min="0" step="10" required />
            </label>
            <label>
              存在確率 (%)
              <input id="probability" type="number" min="1" max="99.9" step="0.1" required />
            </label>
            <label>
              共通周波数認識偏り (Hz)
              <input id="frequency-bias" type="number" step="0.01" required />
            </label>
            <label>
              過去航跡再計算範囲 (秒)
              <input id="smoothing-window" type="number" min="1" max="10800" step="1" required />
            </label>
            <button type="submit">設定を反映</button>
          </form>
        </section>

        <section>
          <h2>表示</h2>
          <label class="check"><input id="show-online" type="checkbox" checked />逐次推定</label>
          <label class="check"><input id="show-smoothed" type="checkbox" checked />更新後推定</label>
          <label class="check"><input id="show-truth" type="checkbox" checked />シミュレーション真値</label>
        </section>

        <button id="reset" class="secondary" type="button">ランタイムをリセット</button>
        <p id="message" role="status" aria-live="polite"></p>
      </aside>
    </main>

    <script>window.CESIUM_BASE_URL = "/cesium/";</script>
    <script src="/cesium/Cesium.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
